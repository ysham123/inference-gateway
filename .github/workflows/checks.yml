name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.100.0 fmt --check
      - name: Lint Rust
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo +1.100.0 test --locked
      - name: Run Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s benchmarks -v
